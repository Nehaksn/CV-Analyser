<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Reviewer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="theme-toggle-wrap">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
        <span class="toggle-icon">🌙</span>
        <span class="toggle-text">Dark</span>
      </button>
    </div>

    <div class="container">
      <header class="hero">
        <p class="eyebrow">AI-style resume feedback</p>
        <h1>CV Reviewer</h1>
      </header>

      <main class="app-grid">
        <section class="panel form-panel">
          <form id="cv-form">
            <div class="field-group">
              <label for="name">Candidate Name</label>
              <input id="name" name="name" type="text" placeholder="Jane Doe" />
            </div>

            <div class="field-group">
              <label for="jobTitle">Target Job Title</label>
              <input id="jobTitle" name="jobTitle" type="text" placeholder="Product Manager" />
            </div>

            <div class="field-group">
              <label for="jobDescriptionFile">Upload Job Description (optional)</label>
              <input id="jobDescriptionFile" name="jobDescriptionFile" type="file" accept=".pdf,.txt,.doc,.docx" />
            </div>

            <div class="field-group">
              <label for="jobDescription">Or paste Job Description</label>
              <textarea id="jobDescription" name="jobDescription" placeholder="Paste the job description here..." rows="8"></textarea>
            </div>

            <div class="field-group">
              <label for="cvFile">Upload PDF Resume (optional)</label>
              <input id="cvFile" name="cvFile" type="file" accept=".pdf" />
            </div>

            <div class="field-group">
              <label for="cvText">Or paste CV / Resume Text</label>
              <textarea id="cvText" name="cvText" placeholder="Paste the full CV here..." rows="16"></textarea>
            </div>

            <button type="submit">Analyze CV</button>
          </form>
        </section>

        <section class="panel result-panel" id="result-panel" aria-live="polite">
          <div class="placeholder" id="placeholder">
            <h2>Your review will appear here</h2>
            <p>Upload a PDF or paste a CV and click Analyze CV to get instant feedback.</p>
          </div>

          <div class="result hidden" id="result">
            <div class="score-card">
              <span class="score-label">CV Score</span>
              <div class="score-row">
                <span id="score">0</span>
                <small>/ 100</small>
              </div>
            </div>

            <div class="summary-box">
              <h3>Overall Summary</h3>
              <p id="summary"></p>
            </div>

            <div class="feedback-box">
              <h3>CV Feedback</h3>
              <p id="feedbackText">Your review details will appear here.</p>
            </div>

            <div class="missing-box">
              <h3>Missing Keywords</h3>
              <ul id="missingKeywords"></ul>
            </div>

            <div class="detail-grid">
              <div class="details">
                <h3>Strengths</h3>
                <ul id="strengths"></ul>
              </div>

              <div class="details">
                <h3>Improvements</h3>
                <ul id="improvements"></ul>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
